name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/SalahWidget/SalahWidget.csproj -c Release -p:Platform=${{ matrix.platform }} -warnaserror

      # Packs the build output (unsigned) so manifest errors fail CI instead of failing at install time.
      - name: Validate MSIX layout
        shell: pwsh
        run: |
          . ./scripts/Common.ps1
          & (Get-SdkTool 'makeappx.exe') pack /d (Get-LayoutPath '${{ matrix.platform }}') /p "$env:RUNNER_TEMP/SalahWidget.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed ($LASTEXITCODE)" }

  test:
    name: Test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test SalahWidget.sln -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx

  scripts:
    name: Check PowerShell scripts
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Parse every script
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem scripts -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=scripts/$($file.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
